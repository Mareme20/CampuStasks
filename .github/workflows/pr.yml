# ==============================================================================
# Pipeline d'Intégration Continue (CI) - Validation des Pull Requests
# ==============================================================================
# Ce workflow s'exécute automatiquement à chaque fois qu'une Pull Request (PR)
# est ouverte ou mise à jour vers la branche principale 'main'.
# Il garantit la non-régression en vérifiant :
#   1. Les tests et la compilation du backend Spring Boot (Java 21)
#   2. La conformité du code Flutter mobile (analyse statique / linter)
#   3. La validité du build de l'image Docker du backend
# ==============================================================================

name: Pull Request CI

# Déclenchement uniquement sur les pull requests ciblant la branche 'main'
on:
  pull_request:
    branches:
      - main

jobs:
  # ----------------------------------------------------------------------------
  # Job 1 : Validation du Backend Spring Boot
  # ----------------------------------------------------------------------------
  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      # Récupération du code source
      - name: Checkout du code source
        uses: actions/checkout@v4

      # Installation de l'environnement JDK 21 (Eclipse Temurin) avec cache Maven
      - name: Configuration de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Exécution des tests unitaires et vérification de la compilation
      - name: Exécution des tests backend avec Maven
        run: mvn -B test

  # ----------------------------------------------------------------------------
  # Job 2 : Analyse statique de l'application mobile Flutter
  # ----------------------------------------------------------------------------
  mobile:
    name: Mobile Flutter Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      # Récupération du code source
      - name: Checkout du code source
        uses: actions/checkout@v4

      # Installation du SDK Flutter avec mise en cache des dépendances
      - name: Configuration de l'environnement Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      # Téléchargement des packages déclarés dans pubspec.yaml
      - name: Installation des dépendances Flutter
        run: flutter pub get

      # Analyse statique du code (détection des erreurs de syntaxe et avertissements)
      - name: Analyse statique du code Flutter
        run: flutter analyze

  # ----------------------------------------------------------------------------
  # Job 3 : Vérification de la construction de l'image Docker
  # ----------------------------------------------------------------------------
  docker:
    name: Docker Build Test
    runs-on: ubuntu-latest
    # Ce job attend que les tests backend et mobile aient réussi avant de s'exécuter
    needs: [backend, mobile]

    steps:
      # Récupération du code source
      - name: Checkout du code source
        uses: actions/checkout@v4

      # Vérifie que le Dockerfile multi-stage compile sans erreur
      - name: Test de construction de l'image Docker du backend
        run: docker build -t campus-tasks-api:test ./backend
