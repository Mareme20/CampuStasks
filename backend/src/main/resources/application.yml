spring:
  application:
    name: campus-tasks-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
springdoc:
  swagger-ui.path: /swagger-ui.html
  api-docs.path: /v3/api-docs
app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_WITH_AT_LEAST_32_CHARACTERS_FOR_DEV_ONLY}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
---
spring:
  config.activate.on-profile: dev
  datasource:
    url: jdbc:h2:mem:campustasks;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate.ddl-auto: create-drop
    open-in-view: false
---
spring:
  config.activate.on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB:campus_tasks}
    username: ${POSTGRES_USER:campus}
    password: ${POSTGRES_PASSWORD:campus_password}
    hikari.maximum-pool-size: 10
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
---
spring:
  config.activate.on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${POSTGRES_DB:campus_tasks}
    username: ${POSTGRES_USER:campus}
    password: ${POSTGRES_PASSWORD:campus_password}
    hikari.maximum-pool-size: 20
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
