# ==============================================================================
# Pipeline de Release Officielle (SemVer) - Docker Hub
# ==============================================================================
# Ce workflow gère le versionnement sémantique (SemVer : Major.Minor.Patch)
# des images Docker lors de la publication d'une release officielle (ex: v1.0.0).
# Il utilise 'docker/metadata-action' pour extraire automatiquement les numéros
# de version à partir des tags Git et générer les labels OCI conformes.
# ==============================================================================

name: Release Docker

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*' # Déclenché lors de la création d'un tag semver (ex: v1.0.0, v1.0.1)

jobs:
  docker:
    name: Build & Release Semantic Version
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupération du dépôt
      - name: Checkout du code source
        uses: actions/checkout@v4

      # Étape 2 : Connexion sécurisée à Docker Hub via les secrets du dépôt
      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Étape 3 : Extraction automatique des métadonnées et génération des tags SemVer
      - name: Extraction des métadonnées Docker (SemVer / tags)
        uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/campus-tasks-api
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest,enable=false

      # Étape 4 : Construction et publication de l'image avec les tags sémantiques et labels OCI
      - name: Construction et publication de l'image Docker
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
