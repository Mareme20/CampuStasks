name: Release Docker
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/campus-tasks-api:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/campus-tasks-api:latest
